pluginManagement {
    plugins {
        id "com.github.spotbugs-base" version "${spotbugsPluginVersion}"
        id "com.gradleup.shadow" version "${shadowJarPluginVersion}"
        id "de.undercouch.download" version "${downloadPluginVersion}"
        id "net.researchgate.release" version "${releasePluginVersion}"
        id "io.ballerina.plugin" version "${ballerinaGradlePluginVersion}"
    }

    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

plugins {
    id "com.gradle.develocity" version "3.19.2"
}

rootProject.name = 'ai'

include ':checkstyle'
include ':ai-native'
include ':ai-ballerina'
include ':ai-ballerina-tests'
include ':ai-compiler-plugin'
include ':ai-compiler-plugin-tests'

project(':checkstyle').projectDir = file("build-config${File.separator}checkstyle")
project(':ai-native').projectDir = file('native')
project(':ai-ballerina').projectDir = file('ballerina')
project(':ai-ballerina-tests').projectDir = file("ballerina-tests")
project(':ai-compiler-plugin').projectDir = file('compiler-plugin')
project(':ai-compiler-plugin-tests').projectDir = file("compiler-plugin-tests")

develocity {
    buildScan {
        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
    }
}
